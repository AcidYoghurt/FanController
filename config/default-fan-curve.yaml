schema_version: 1

curve:
  id: default-reference
  display_name: 默认风扇曲线
  temperature_unit: celsius
  duty_unit: percent

  # 参考图片中的温度—风扇转速节点。
  # 如果硬件不支持停转或存在更高的最低占空比，后端会将 duty
  # 自动提高到该风扇区域允许的最低值。
  points:
    - temperature: 35
      duty: 0
    - temperature: 40
      duty: 30
    - temperature: 45
      duty: 40
    - temperature: 50
      duty: 45
    - temperature: 60
      duty: 50
    - temperature: 65
      duty: 60
    - temperature: 70
      duty: 70
    - temperature: 80
      duty: 80
    - temperature: 90
      duty: 90
    - temperature: 100
      duty: 100

behavior:
  clamp_to_zone_minimum_duty: true
  force_full_speed_at_zone_safety_temperature: true
  keep_legacy_five_point_curves: true
